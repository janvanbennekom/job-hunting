<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JobHunter</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        line-height: 1.5;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #e2e8f0;
      }
      main {
        max-width: 36rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 1.75rem;
        margin-bottom: 0.5rem;
      }
      p {
        color: #94a3b8;
        margin: 0 0 1.5rem;
      }
      a.button {
        display: inline-block;
        padding: 0.75rem 1.25rem;
        border-radius: 0.5rem;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      a.button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>JobHunter</h1>
      <p>
        Personal decision support for discovering, assessing, and ranking
        international consulting and specialist opportunities aligned with your
        professional profile and search strategy.
      </p>
      <a class="button" href="/app/">Sign in to JobHunter</a>
    </main>
  </body>
</html>
