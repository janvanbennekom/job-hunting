[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunter"
version = "0.1.0"
description = "Personal AI-assisted opportunity discovery and application support"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Jan van Bennekom-Minnema" }]

dependencies = [
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3",
    "alembic>=1.13",
    "openpyxl>=3.1",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: PostgreSQL integration tests (require database configuration)",
    "live: optional tests that call external websites",
]
