# JobHunter — production / Synology (external PostgreSQL only).
# Compatible with Docker Compose v2.20.x (no merge/!reset).
#
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml --profile tools run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d web status edge
#
# Worker (Task Scheduler):
#   docker compose -f docker-compose.prod.yml --profile worker run --rm worker
#
# /app is protected by Caddy HTTP basic auth (user + bcrypt hash in .env).
# Local development uses docker-compose.yml (+ optional docker-compose.bundled-db.yml).

name: jobhunter

services:
  web:
    build: .
    image: jobhunter:local
    restart: unless-stopped
    env_file: .env
    environment:
      JOBHUNTER_ENV: production
      JOBHUNTER_AUTOMATION_CONFIG: ${JOBHUNTER_AUTOMATION_CONFIG:-/config/automation.json}
    command:
      [
        "streamlit",
        "run",
        "src/jobhunter/ui/streamlit/app.py",
        "--server.port=8501",
        "--server.address=0.0.0.0",
        "--server.headless=true",
        "--server.baseUrlPath=/app",
        "--server.enableCORS=false",
        "--server.enableXsrfProtection=true",
      ]
    volumes:
      - ${JOBHUNTER_AUTOMATION_CONFIG_HOST:-./config/automation.json}:/config/automation.json:ro
    networks:
      - jobhunter_internal
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:8501/app/_stcore/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  migrate:
    build: .
    image: jobhunter:local
    env_file: .env
    environment:
      JOBHUNTER_ENV: production
      JOBHUNTER_AUTOMATION_CONFIG: ${JOBHUNTER_AUTOMATION_CONFIG:-/config/automation.json}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    profiles:
      - tools
    networks:
      - jobhunter_internal

  status:
    build: .
    image: jobhunter:local
    restart: unless-stopped
    env_file: .env
    environment:
      JOBHUNTER_ENV: production
      JOBHUNTER_STATUS_PORT: "8502"
    command: ["python", "-m", "jobhunter.ui.public_status.server"]
    networks:
      - jobhunter_internal
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:8502/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build: .
    image: jobhunter:local
    env_file: .env
    environment:
      JOBHUNTER_ENV: production
      JOBHUNTER_AUTOMATION_CONFIG: ${JOBHUNTER_AUTOMATION_CONFIG:-/config/automation.json}
    volumes:
      - ${JOBHUNTER_AUTOMATION_CONFIG_HOST:-./config/automation.json}:/config/automation.json:ro
    command: ["python", "scripts/run_scheduled_pipeline.py", "--apply-if-due"]
    profiles:
      - worker
    networks:
      - jobhunter_internal
    healthcheck:
      disable: true

  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "${JOBHUNTER_EDGE_BIND:-127.0.0.1}:${JOBHUNTER_EDGE_PORT:-8080}:8080"

    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/landing:/srv/landing:ro
    depends_on:
      web:
        condition: service_healthy
      status:
        condition: service_healthy
    networks:
      - jobhunter_internal
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  jobhunter_internal:
    driver: bridge
